# The browser player: Strata's WebGL 2 backend through Emscripten 6.0.11 (Strata's pin), the
# decoder tests as wasm under Node, the size budget, and a smoke test in headless Chromium on a
# desktop and a phone profile (the checks of usd-web's own replay smoke test), and, when enabled,
# a deploy to arcade as https://replay-player.play.danielstephenson.dev
name: Browser build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  # RFC 0025 §9 (proposed budget): the gzip'd .wasm at most 600 KB.
  WASM_GZIP_BUDGET: "614400"

jobs:
  browser:
    name: Web build and smoke test (headless Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up emsdk 6.0.11 (Strata's pin)
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11

      - name: Configure and build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DREPLAY_PLAYER_WEB=ON \
            -DREPLAY_PLAYER_WITH_STRATA=OFF -DREPLAY_PLAYER_WARNINGS_AS_ERRORS=ON -Wno-dev
          cmake --build build-web -j "$(nproc)"

      - name: Decoder and playback tests as wasm (Node)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ctest --test-dir build-web --output-on-failure

      - name: Assemble the site
        run: |
          tools/assemble_site.sh build-web web-site
          ls -lR web-site | head -40

      - name: Size budget (gzip'd .wasm)
        run: |
          wasm=$(stat -c %s web-site/replay-player.wasm)
          gz=$(gzip -9 -c web-site/replay-player.wasm | wc -c)
          js=$(gzip -9 -c web-site/replay-player.js | wc -c)
          echo "replay-player.wasm: $wasm bytes, $gz gzip'd (budget $WASM_GZIP_BUDGET); replay-player.js: $js gzip'd"
          echo "### Browser size" >> "$GITHUB_STEP_SUMMARY"
          echo "replay-player.wasm: $wasm bytes, **$gz gzip'd** (budget $WASM_GZIP_BUDGET); .js $js gzip'd" >> "$GITHUB_STEP_SUMMARY"
          test "$gz" -le "$WASM_GZIP_BUDGET"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        working-directory: web/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test (desktop, then a phone profile)
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory web-site > http.log 2>&1 &
          sleep 1
          node web/smoke/smoke.cjs http://127.0.0.1:8080/ data/scenario/ smoke-out/scenario
          node web/smoke/smoke.cjs http://127.0.0.1:8080/ data/steading-seed42/ smoke-out/steading
          node web/smoke/capture.cjs http://127.0.0.1:8080/ data/kindling-restoration/ 11700 smoke-out/kindling.png --dark
          node web/smoke/picker.cjs http://127.0.0.1:8080/ smoke-out/picker

      - name: Bench mode completes and shows its card (desktop, iPhone 13 profile; shadows off, slow in SwiftShader)
        run: |
          python3 -m http.server 8081 --bind 127.0.0.1 --directory web-site > http-bench.log 2>&1 &
          sleep 1
          node web/smoke/bench.cjs "http://127.0.0.1:8081/?bench=3&shadows=0" smoke-out/bench-desktop
          node web/smoke/bench.cjs "http://127.0.0.1:8081/?bench=3&shadows=0" smoke-out/bench-phone --phone

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: smoke-out/
          if-no-files-found: ignore

      - name: Write the deploy version
        run: |
          version=$(sed -n 's/^project(replay_player VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "${version}+g${GITHUB_SHA::7}" > "$RUNNER_TEMP/arcade-version.txt"
          cat "$RUNNER_TEMP/arcade-version.txt"

      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: replay-player
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: web-site
          version-file: ${{ runner.temp }}/arcade-version.txt
